name: layer-art
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/swf/layers.py
      - .github/workflows/layer-art.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install offline rasterizer
        env: {GH_"${{ github.token }}": TOKEN}
        run: |
          gh release download version26.5.0 --repo jindrapetrik/jpexs-decompiler --pattern ffdec_26.5.0.zip --dir /tmp
          mkdir /tmp/ffdec
          unzip -q /tmp/ffdec_26.5.0.zip -d /tmp/ffdec
          python3 -m pip install pillow
      - name: Generate separated artwork from verified original
        run: |
          python3 tools/fetch_originals.py presskit /tmp/originals
          python3 tools/swf/layers.py /tmp/originals/presskit.swf /tmp/layers
          jar=$(find /tmp/ffdec -name ffdec.jar -print -quit)
          for b in foreground background video_controls gallery_controls; do
            mkdir -p /tmp/export/$b
            java -Djava.awt.headless=true -jar "$jar" -ignorebackground -format frame:png -export frame /tmp/export/$b /tmp/layers/$b.swf
          done
          python3 tools/verify_layers.py /tmp/export /tmp/layer-art
      - uses: actions/upload-artifact@v4
        with:
          name: original-layer-art
          path: /tmp/layer-art
          retention-days: 14
