name: swf
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - target.toml
      - tools/swf/**
      - records/avm1_functions.tsv
      - tools/fetch_originals.py
      - .github/workflows/swf.yml
permissions:
  contents: read
concurrency:
  group: swf
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned FFDec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download version26.5.0 --repo jindrapetrik/jpexs-decompiler --pattern ffdec_26.5.0.zip --dir /tmp
          mkdir /tmp/ffdec
          unzip -q /tmp/ffdec_26.5.0.zip -d /tmp/ffdec
          find /tmp/ffdec -name ffdec.jar -print -quit > /tmp/ffdec-jar
          test -s /tmp/ffdec-jar
      - name: Verify originals and export application code
        run: |
          mkdir -p /tmp/originals
          python3 tools/fetch_originals.py windows_projector /tmp/originals
          python3 tools/fetch_originals.py launcher /tmp/originals
          python3 tools/fetch_originals.py presskit /tmp/originals
          python3 tools/swf/verify_projector.py /tmp/originals/windows_projector.exe /tmp/originals/launcher.swf
          for b in launcher presskit; do
            mkdir -p /tmp/avm1/$b
            python3 tools/swf/analyze.py /tmp/originals/$b.swf /tmp/avm1/$b
            python3 tools/swf/display_list.py /tmp/originals/$b.swf /tmp/avm1/$b/layout $b
            java -jar "$(cat /tmp/ffdec-jar)" -export script /tmp/avm1/$b/scripts /tmp/originals/$b.swf
            test -n "$(find /tmp/avm1/$b/scripts -type f -name '*.as' -print -quit)"
          done
      - name: Verify authored identities
        run: python3 tools/swf/verify_records.py /tmp/avm1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avm1-analysis
          path: /tmp/avm1/
          retention-days: 14
  publish-index:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: avm1-analysis
          path: /tmp/avm1
      - name: Publish compact generated evidence
        run: |
          python3 tools/swf/verify_records.py /tmp/avm1
          for b in launcher presskit; do
            mkdir -p analysis/$b
            cp /tmp/avm1/$b/{metadata.json,functions.jsonl,action_blocks.jsonl} analysis/$b/
            mkdir -p analysis/$b/layout
            cp /tmp/avm1/$b/layout/* analysis/$b/layout/
          done
          git config user.name "avm1-pipeline"
          git config user.email "avm1-pipeline@users.noreply.github.com"
          python3 tools/status.py
          git add analysis/launcher analysis/presskit STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified AVM1 analysis indexes"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; git rebase --abort || true; sleep 5; done
          exit 1
