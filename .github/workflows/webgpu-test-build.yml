name: webgpu-test-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'enhanced-rust/**'
      - 'target.toml'
      - 'records/originals.tsv'
      - 'tools/fetch_originals.py'
      - 'tools/prepare_player_assets.py'
      - 'tools/swf/analyze.py'
      - '.github/workflows/webgpu-test-build.yml'

permissions:
  contents: read

concurrency:
  group: black-ops-1-webgpu-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          targets: wasm32-unknown-unknown

      - name: Install build tools
        run: |
          python -m venv "$RUNNER_TEMP/presskit-venv"
          echo "$RUNNER_TEMP/presskit-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/presskit-venv/bin/python" -m pip install --upgrade pip pillow
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Download offline SWF artwork rasterizer
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ffdec_26.5.0.zip" \
            https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.5.0/ffdec_26.5.0.zip
          mkdir "$RUNNER_TEMP/ffdec"
          unzip -q "$RUNNER_TEMP/ffdec_26.5.0.zip" -d "$RUNNER_TEMP/ffdec"
          echo "FFDEC_JAR=$(find "$RUNNER_TEMP/ffdec" -name ffdec.jar -print -quit)" >> "$GITHUB_ENV"

      - name: Fetch and verify only the two original SWFs
        run: |
          python tools/fetch_originals.py launcher "$RUNNER_TEMP/originals"
          python tools/fetch_originals.py presskit "$RUNNER_TEMP/originals"

      - name: Prepare launcher and original embedded audio
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-export" "$RUNNER_TEMP/reference/art/launcher" "$RUNNER_TEMP/reference/art/sounds"
          java -Djava.awt.headless=true -jar "$FFDEC_JAR" \
            -format frame:png -export frame \
            "$RUNNER_TEMP/launcher-export" "$RUNNER_TEMP/originals/launcher.swf"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from prepare_player_assets import normalize, sound_export
          root=Path(os.environ['RUNNER_TEMP'])
          normalize(root/'launcher-export', root/'reference/art/launcher', 1)
          sound_export(root/'originals/presskit.swf', root/'reference/art/sounds')
          PY

      - name: Build compact runtime artwork without copying external media
        run: |
          python enhanced-rust/tools/prepare_compact_assets.py \
            "$RUNNER_TEMP/originals/presskit.swf" \
            "$RUNNER_TEMP/reference" \
            "$RUNNER_TEMP/runtime" \
            --ffdec-jar "$FFDEC_JAR" \
            --no-payload
          mkdir -p enhanced-rust/web/assets
          cp -a "$RUNNER_TEMP/runtime/art" enhanced-rust/web/assets/

      - name: Download and verify all 44 original R2 payload files
        working-directory: enhanced-rust
        run: |
          python tools/test_fetch_payload.py
          python tools/fetch_payload.py \
            --manifest tools/payload-manifest.json \
            --destination web/assets/payload \
            --base-url https://r2.houseofkublai.com/bo1-press-kit/payload/ \
            --workers 6

      - name: Compile Rust application to WebAssembly and test
        working-directory: enhanced-rust
        env:
          PRESSKIT_FG_ASSETS: ${{ runner.temp }}/runtime/art/foreground-source
        run: |
          sh tools/build_web.sh
          cargo test --offline -p presskit-core
          cargo test -p presskit-renderer --test background
          node --test web/asset-queue.test.mjs web/asset-urls.test.mjs web/wasm-core.test.mjs

      - name: Assemble self-contained static website
        working-directory: enhanced-rust
        run: |
          rm -rf dist
          mkdir -p dist
          cp web/index.html web/main.js web/asset-queue.mjs web/asset-urls.mjs dist/
          cp -a web/pkg dist/pkg
          cp -a web/assets dist/assets
          touch dist/.nojekyll
          {
            echo "Black Ops press kit — Rust/WebGPU self-contained browser build"
            echo "Commit: $GITHUB_SHA"
            echo "Original payload: 44 files / 409,146,676 bytes"
            echo "All media is same-origin and loaded on demand; no runtime R2 requests."
          } > dist/BUILD_INFO.txt
          python - <<'PY'
          from pathlib import Path
          root=Path('dist')
          total=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'Static site size: {total:,} bytes ({total/1048576:.2f} MiB)')
          if total >= 1_000_000_000:
              raise SystemExit('GitHub Pages 1 GB site limit exceeded')
          payload=list((root/'assets/payload').rglob('*'))
          files=[p for p in payload if p.is_file()]
          if len(files)!=44:
              raise SystemExit(f'Expected 44 original payload files, found {len(files)}')
          PY
          find dist -type f | wc -l

      - name: Upload self-contained browser build
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-self-contained-site
          path: enhanced-rust/dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the exact tested site artifact
        uses: actions/download-artifact@v4
        with:
          name: webgpu-self-contained-site
          path: site

      - name: Preserve static hosting marker
        run: touch site/.nojekyll

      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Package site for GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy website
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Explain one-time Pages setting if not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages needs enabling::Open repository Settings → Pages → Build and deployment → Source, choose GitHub Actions, then rerun this workflow. The self-contained ZIP artifact is already available."
