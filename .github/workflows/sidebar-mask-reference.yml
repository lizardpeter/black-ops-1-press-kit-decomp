name: sidebar-mask-reference
on:
  workflow_dispatch:
  push:
    branches: [validation/sidebar-mask]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate action-free isolated original artwork
        run: |
          pip install pillow
          python tools/fetch_originals.py presskit "$RUNNER_TEMP/originals"
          python enhanced-rust/tools/sidebar_reference.py "$RUNNER_TEMP/originals/presskit.swf" "$RUNNER_TEMP/fixture"
      - name: Compare FFDec offline rendering with source masks
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ffdec.zip" https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.5.0/ffdec_26.5.0.zip
          unzip -q "$RUNNER_TEMP/ffdec.zip" -d "$RUNNER_TEMP/ffdec"
          jar="$(find "$RUNNER_TEMP/ffdec" -name ffdec.jar -print -quit)"
          for scene in sidebar-plain sidebar-blur sidebar-flat-plain sidebar-flat-blur; do
            mkdir -p "$RUNNER_TEMP/fixture/$scene"
            java -Djava.awt.headless=true -jar "$jar" -format frame:png -export frame "$RUNNER_TEMP/fixture/$scene" "$RUNNER_TEMP/fixture/$scene.swf"
            cp "$(find "$RUNNER_TEMP/fixture/$scene" -name '*.png' -print -quit)" "$RUNNER_TEMP/fixture/$scene-ffdec.png"
          done
      - name: Independent Ruffle reference capture (test only)
        run: |
          cd "$RUNNER_TEMP/fixture"
          npm install --no-audit --no-fund --ignore-scripts @ruffle-rs/ruffle@0.2.0 playwright@1.56.1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/enhanced-rust/tools/sidebar_reference_capture.mjs" .
          printf '%s' '<!doctype html><html><head><style>html,body{margin:0;background:black;overflow:hidden}</style><script src="node_modules/@ruffle-rs/ruffle/ruffle.js"></script></head><body></body></html>' > index.html
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/sidebar-http.log 2>&1 &
          node sidebar_reference_capture.mjs "$RUNNER_TEMP/fixture"
      - name: Report masked button coverage
        run: python enhanced-rust/tools/sidebar_reference_score.py "$RUNNER_TEMP/fixture"
      - name: Retain diagnostic images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-sidebar-reference
          path: ${{ runner.temp }}/fixture/*.png
          if-no-files-found: ignore
          retention-days: 7
